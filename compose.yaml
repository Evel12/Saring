services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saring
      POSTGRES_PASSWORD: saring
      POSTGRES_DB: saring
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saring"]
      interval: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://saring:saring@db:5432/saring
      COOKIE_SECURE: "true"
    command: alembic upgrade head
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://saring:saring@db:5432/saring
    volumes: ["files:/app/storage"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://saring:saring@db:5432/saring
    command: python -m backend.worker
    volumes: ["files:/app/storage"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: Dockerfile.web}
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:8080:3000"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  database:
  files:
