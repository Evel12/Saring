services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saring
      POSTGRES_PASSWORD: saring
      POSTGRES_DB: saring
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saring"]
      interval: 3s
      retries: 20
  migrate:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://saring:saring@db:5432/saring
    command: alembic upgrade head
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://saring:saring@db:5432/saring
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
    volumes: ["files:/app/storage", "sessions:/app/.runtime"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://saring:saring@db:5432/saring
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
    command: python -m backend.worker
    volumes: ["files:/app/storage", "sessions:/app/.runtime"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: {context: ., dockerfile: Dockerfile.web}
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
volumes:
  database:
  files:
  sessions:
